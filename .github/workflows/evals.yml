# Evals workflow — the robot runs the golden-set exam with the REAL brain.
#
# Why here and not on a laptop: GitHub's machines have open internet, and
# the API key lives safely in GitHub Secrets (Settings → Secrets → Actions),
# never in code. The scorecard is committed back to eval_reports/ so anyone
# can read the current measured quality of the system.

name: Evals

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also runnable by hand from the Actions tab

permissions:
  contents: write         # allowed to commit the scorecard back

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt httpx

      - name: Provider diagnostics (statuses + Google's error bodies, never the key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p eval_reports
          {
            echo "key length: ${#GEMINI_API_KEY}"
            echo "--- v1beta/models, header auth ---"
            curl -s -o /tmp/b1 -w 'status=%{http_code}\n' -H "x-goog-api-key: $GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1beta/models
            head -c 400 /tmp/b1; echo
            echo "--- v1beta/models, query auth ---"
            curl -s -o /tmp/b2 -w 'status=%{http_code}\n' "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY"
            head -c 400 /tmp/b2; echo
            echo "--- v1/models, header auth ---"
            curl -s -o /tmp/b3 -w 'status=%{http_code}\n' -H "x-goog-api-key: $GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1/models
            head -c 400 /tmp/b3; echo
            echo "--- same call from python urllib (what the app uses) ---"
            python3 evals/probe_gemini.py
            echo "--- POST generateContent v1beta, header auth ---"
            curl -s -o /tmp/p1 -w 'status=%{http_code}\n' -X POST \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply with exactly: OK"}]}]}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
            head -c 400 /tmp/p1; echo
            echo "--- POST generateContent v1, header auth ---"
            curl -s -o /tmp/p2 -w 'status=%{http_code}\n' -X POST \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply with exactly: OK"}]}]}' \
              "https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent"
            head -c 400 /tmp/p2; echo
          } > eval_reports/diag.txt

      - name: Run the golden-set evals
        env:
          # The secret: set once in the repo settings, injected here.
          # If the secret is absent, this is empty and the mock runs —
          # the workflow degrades honestly instead of failing.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m evals.run_evals

      - name: Publish the scorecard back to the repo
        run: |
          mkdir -p eval_reports
          cp evals/results/run_*.json eval_reports/latest.json
          cat eval_reports/latest.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add eval_reports/latest.json eval_reports/diag.txt
          git commit -m "Update eval scorecard [skip ci]" || echo "no change"
          git push
